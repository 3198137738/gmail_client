services:
  gmail-client:
    build:
      context: .
      dockerfile: Dockerfile
    image: gmail-client:latest
    container_name: gmail-client
    restart: unless-stopped
    env_file:
      - .env

    # 只监听本机：nginx 容器使用 host 网络，通过 proxy_pass http://127.0.0.1:8000 访问；
    # 公网无法绕过 nginx（和它的 HTTPS、访问日志）直连 8000。
    ports:
      - "127.0.0.1:8000:8000"

    volumes:
      - ./data:/app/data
      - ./attachments:/app/attachments
      - ./secrets:/app/secrets
      - ./logs:/app/logs
      # 每日自动备份（数据库快照 + 密钥）。在 .env 设置 BACKUP_PUBLIC_KEY 后加密保存，
      # 并可按 BACKUP_UPLOAD_TELEGRAM / BACKUP_WEBDAV_URL 自动上传到异地
      - ./backups:/app/backups

    environment:
      TZ: Asia/Shanghai
      PYTHONUNBUFFERED: "1"
      # 可信代理：只有这些地址发来的 X-Forwarded-For 才会被当作真实客户端 IP。
      # nginx 连 127.0.0.1:8000 时，请求经 docker-proxy 转发，应用看到的来源是本网络的
      # 网关 172.19.0.1（网段在文件末尾固定），必须列入，否则所有访客都会被识别成同一个 IP
      # （登录失败封禁会波及所有人）。端口只绑本机，外部无法以网关地址到达，信任它是安全的。
      # 不要加入整个私有网段（172.16.0.0/12 等），只列这一个网关地址。
      FORWARDED_ALLOW_IPS: "127.0.0.1,::1,172.19.0.1"
      # 会话 cookie 默认只走 HTTPS；只能用 http:// 访问时在 .env 设 SESSION_COOKIE_SECURE=false
      # 登录有效期（天）可用 SESSION_MAX_AGE_DAYS 调整，默认 7

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# 固定本项目网络的网段：可信代理里写的是网关地址 172.19.0.1，
# 不固定的话 docker compose down 后重建网络可能换网段，访客 IP 就会全部识别错。
networks:
  default:
    ipam:
      config:
        - subnet: 172.19.0.0/16
          gateway: 172.19.0.1
