services:
  gmail-client:
    build:
      context: .
      dockerfile: Dockerfile
    image: gmail-client:latest
    container_name: gmail-client
    restart: unless-stopped
    env_file:
      - .env

    # 仅在服务器本地通过 Nginx/Caddy 反代时，把端口绑到 127.0.0.1:8000 更安全。
    # 直接公网访问就用下面这种 0.0.0.0:8000 的写法。
    ports:
      - "8000:8000"

    volumes:
      - ./data:/app/data
      - ./attachments:/app/attachments
      - ./secrets:/app/secrets
      - ./logs:/app/logs

    environment:
      TZ: Asia/Shanghai
      PYTHONUNBUFFERED: "1"
      # 会话 cookie 默认只走 HTTPS；只能用 http:// 访问时在 .env 设 SESSION_COOKIE_SECURE=false
      # 登录有效期（天）可用 SESSION_MAX_AGE_DAYS 调整，默认 7

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
