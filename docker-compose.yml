services:
  gmail-client:
    build:
      context: .
      dockerfile: Dockerfile
    image: gmail-client:latest
    container_name: gmail-client
    restart: unless-stopped
    env_file:
      - .env

    # 目前 nginx 容器经服务器公网 IP 连到 8000 端口，所以端口暂时只能对外监听；
    # 这意味着任何人都能绕过 nginx（和它的 HTTPS）直连 8000。更安全的做法：
    #   把本服务加入 nginx 所在的 Docker 网络、nginx 改为 proxy_pass http://gmail-client:8000，
    #   然后删掉下面的 ports（或改成 "127.0.0.1:8000:8000"），并把 FORWARDED_ALLOW_IPS 换成该网络的网段。
    ports:
      - "8000:8000"

    volumes:
      - ./data:/app/data
      - ./attachments:/app/attachments
      - ./secrets:/app/secrets
      - ./logs:/app/logs
      # 每日自动备份（数据库快照 + 密钥），请定期拷到服务器以外的地方
      - ./backups:/app/backups

    environment:
      TZ: Asia/Shanghai
      PYTHONUNBUFFERED: "1"
      # 可信代理：只有这些地址发来的 X-Forwarded-For 才会被当作真实客户端 IP。
      # nginx 通过服务器公网地址 168.110.213.213 转发，必须列入，否则所有访客
      # 都会被识别成这个 IP（登录失败封禁会波及所有人）。换服务器时记得修改。
      # 不要再加入 Docker 私有网段（172.16.0.0/12 等）：绕过 nginx 直连 8000 端口的请求
      # 可能经 docker-proxy 以网关地址（172.x）到达，一旦被信任，攻击者就能用伪造的
      # X-Forwarded-For 每次换一个 IP，绕过登录失败封禁无限尝试密码。
      FORWARDED_ALLOW_IPS: "127.0.0.1,::1,168.110.213.213"
      # 会话 cookie 默认只走 HTTPS；只能用 http:// 访问时在 .env 设 SESSION_COOKIE_SECURE=false
      # 登录有效期（天）可用 SESSION_MAX_AGE_DAYS 调整，默认 7

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
