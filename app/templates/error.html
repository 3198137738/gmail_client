{% extends "base.html" %}
{% block title %}{{ status_code }}{% endblock %}
{% block bare_body %}
<main class="gm-error">
    <img src="{{ url_for('static', path='img/logo.svg') }}" alt="" width="48" height="36">
    <p class="gm-error-code"><b>{{ status_code }}.</b> <ins>出错了。</ins></p>
    <p class="gm-error-detail">{{ detail }}</p>
    <a href="/" class="gm-btn gm-btn-filled">返回收件箱</a>
</main>
{% endblock %}
