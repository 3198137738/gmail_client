{# Gmail 式设置页标题与标签页。settings_tab: 'accounts' / 'blocked' #}
<div class="gm-settings-head">
    <h1 class="gm-settings-title">设置</h1>
    <nav class="gm-settings-tabs" aria-label="设置分类">
        <a class="gm-settings-tab {% if settings_tab == 'accounts' %}is-active{% endif %}" href="{{ url_for('accounts.list') }}">账号和导入</a>
        <a class="gm-settings-tab {% if settings_tab == 'blocked' %}is-active{% endif %}" href="{{ url_for('messages.blocked_senders') }}">过滤器和屏蔽的地址</a>
    </nav>
</div>
